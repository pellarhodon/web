<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pellarhodon</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Runic&display=swap');

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body, html {
            width: 100%; 
            min-height: 100vh;
            background-color: #000; 
            color: #cc0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* HEADER */
        .header { 
            margin-top: 6vh; 
            text-align: center; 
        }
        
        h1 {
            font-size: clamp(40px, 12vw, 110px);
            letter-spacing: 25px; 
            color: #1a0000;
            text-transform: uppercase;
            animation: slowPulse 8s ease-in-out infinite;
            user-select: none;
        }

        @keyframes slowPulse {
            0%, 100% { color: #1a0000; text-shadow: 0 0 5px rgba(0,0,0,0); }
            50% { color: #880000; text-shadow: 0 0 25px rgba(255, 0, 0, 0.2); }
        }

        /* FOOTER & LAYOUT */
        .footer {
            margin-bottom: 5vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 0 15px;
        }

        .interactive-node {
            opacity: 0.5;
            transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.6s ease;
        }
        
        .interactive-node:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        /* DND BUTTON DESIGN WITH MJÖLNIR & RUNES */
        .dnd-node-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(15,0,0,0.98) 0%, rgba(30,0,0,0.95) 100%);
            border-top: 2px solid #cc0000;
            border-bottom: 1px solid #220000;
            border-left: 1px solid rgba(204, 0, 0, 0.2);
            border-right: 1px solid rgba(204, 0, 0, 0.2);
            border-radius: 2px;
            color: #cc0000;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        .dnd-node-btn:hover {
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.3);
            border-top-color: #ff0000;
        }

        .mjolnir-btn-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #cc0000;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .dnd-node-btn:hover .mjolnir-btn-icon {
            transform: translateY(-2px);
            filter: drop-shadow(0 0 5px #cc0000);
        }

        .runic-btn-text {
            font-family: 'Noto Sans Runic', 'Courier New', monospace;
            font-size: 16px;
            letter-spacing: 4px;
            color: #cc0000;
        }

        /* KO-FI CONTAINER */
        .kofi-widget-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 8px;
            background: rgba(15, 0, 0, 0.9);
            border: 1px solid #330000;
            border-top: 1px solid #660000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        /* R6 TRACKER OVERLAY CONTAINER */
        .r6-overlay-wrapper {
            width: 100%;
            max-width: 500px;
            height: 150px;
            background: linear-gradient(135deg, rgba(15,0,0,0.98) 0%, rgba(30,0,0,0.95) 100%);
            border-top: 2px solid #cc0000;
            border-bottom: 1px solid #220000;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
        }

        .r6-tracker-frame {
            width: 100%;
            height: 100%;
            border: none;
            filter: drop-shadow(0 0 10px rgba(204, 0, 0, 0.2));
        }

        /* TERMINAL STATS */
        .terminal-info { 
            text-align: center; 
        }
        
        .line { 
            font-size: 16px; 
            text-transform: uppercase; 
            margin: 10px 0; 
            letter-spacing: 2px; 
            word-break: break-word;
        }
        
        .label { color: #550000; }
        .value { color: #cc0000; font-weight: bold; }
        .separator { color: #330000; margin: 0 12px; }

            margin: 15px 0; 
            border-left: 4px solid #220000; 
            padding-left: 25px; 
            text-align: left;
