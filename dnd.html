<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foldjord // D&D Campaign Archive</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Runic&display=swap');

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body, html {
            width: 100%; 
            min-height: 100vh;
            background-color: #0a0b0d;
            
            background-image: 
                linear-gradient(rgba(10, 11, 13, 0.65), rgba(10, 11, 13, 0.85)),
                url('Foldjord.jpg');
            
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: #b5a895;
            font-family: 'Courier Prime', monospace;
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* NAVIGATION / BACK LINK */
        .nav-header {
            width: 100%;
            max-width: 800px;
            padding: 25px 20px 0 20px;
            display: flex;
            justify-content: flex-start;
        }

        .back-link {
            font-size: 13px;
            color: #e5d3b3;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            transition: color 0.4s ease, transform 0.4s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            background: rgba(10, 11, 13, 0.85);
            padding: 8px 14px;
            border-radius: 2px;
            border: 1px solid rgba(200, 150, 62, 0.4);
        }

        .back-link:hover {
            color: #c8963e;
            transform: translateX(-4px);
        }

        /* HEADER AREA */
        .main-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-top: 2vh;
            margin-bottom: 6vh;
        }

        .realm-title {
            text-align: center;
            position: relative;
            background: rgba(10, 11, 13, 0.85);
            padding: 20px 40px;
            border-radius: 4px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(200, 150, 62, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .realm-title::after {
            content: '';
            display: block;
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c8963e, transparent);
            margin: 20px auto 0 auto;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(42px, 10vw, 86px);
            font-weight: 900;
            letter-spacing: 12px; 
            color: #e5d3b3;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(200, 150, 62, 0.3);
            margin: 0;
            user-select: none;
        }

        .subtitle {
            font-size: 13px;
            letter-spacing: 6px;
            color: #a82e2e;
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* CONTENT PLACEHOLDER CARD */
        .archive-card {
            width: 100%;
            background: rgba(12, 14, 18, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 2px solid #c8963e;
            border-bottom: 1px solid #232730;
            border-left: 1px solid rgba(200, 150, 62, 0.2);
            border-right: 1px solid rgba(200, 150, 62, 0.2);
            border-radius: 2px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
        }

        /* MJÖLNIR SYMBOL & RUNES CONTAINER */
        .norse-icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: float 6s ease-in-out infinite;
        }

        .mjolnir-svg {
            width: 60px;
            height: 60px;
            fill: none;
            stroke: #c8963e;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 10px rgba(200, 150, 62, 0.5));
        }

        .runic-text {
            font-family: 'Noto Sans Runic', 'Cinzel', serif;
            font-size: 22px;
            letter-spacing: 6px;
            color: #c8963e;
            text-shadow: 0 0 10px rgba(200, 150, 62, 0.4);
            user-select: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .status-msg {
            font-size: 15px;
            letter-spacing: 3px;
            color: #e5d3b3;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            color: #8c8172;
            max-width: 500px;
        }

        /* FOOTER */
        .footer-sig {
            font-size: 11px;
            letter-spacing: 3px;
            color: #e5d3b3;
            text-transform: uppercase;
            margin-bottom: 4vh;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            background: rgba(10, 11, 13, 0.85);
            padding: 6px 14px;
            border-radius: 2px;
            border: 1px solid rgba(200, 150, 62, 0.3);
        }

        .highlight {
            color: #a82e2e;
        }
    </style>
</head>
<body>

    <header class="nav-header">
        <a href="index.html" class="back-link">
            &larr; [ RETURN_TO_TERMINAL ]
        </a>
    </header>

    <main class="main-container">
        <section class="realm-title">
            <h1>FOLDJORD</h1>
            <div class="subtitle">CAMPAIGN // CHRONICLES</div>
        </section>

        <section class="archive-card">
            <div class="norse-icon-wrapper">
                <!-- SVG MJÖLNIR -->
                <svg class="mjolnir-svg" viewBox="0 0 100 100">
                    <!-- Rukojeť -->
                    <path d="M50 20 L50 62" stroke-width="4"/>
                    <path d="M46 22 H54 M46 30 H54 M46 38 H54 M46 46 H54" stroke-width="2"/>
                    <!-- Hlavice kladiva -->
                    <path d="M22 62 L78 62 L85 75 L75 90 L25 90 L15 75 Z" fill="rgba(10, 11, 13, 0.6)" stroke-width="2.5"/>
                    <!-- Vnitřní rytí a vzory -->
                    <path d="M30 68 L70 68 M28 84 L72 84" stroke-width="1.5"/>
                    <circle cx="50" cy="76" r="4" fill="#c8963e"/>
                    <!-- Poutko na rukojeti -->
                    <path d="M42 16 C 42 8, 58 8, 58 16 Z" stroke-width="2"/>
                </svg>

                <!-- PŘESNÝ NÁPIS FOLDJORD (ᚠᛟᛚᛞᛃᛟᚱᛞ) -->
                <div class="runic-text">ᚠᛟᛚᛞᛃᛟᚱᛞ</div>
            </div>

            <div class="status-msg">[ ARCHIVE_SEALED ]</div>
            <p class="description">
                Kroniky, mapy a záznamy z temného světa Foldjord jsou momentálně uzamčeny. Brzy zde přibudou přehledy sezení, lore a profily postav.
            </p>
        </section>
    </main>

    <footer class="footer-sig">
        DM_LOGS // <span class="highlight">PELLARHODON</span>
    </footer>

</body>
</html>
