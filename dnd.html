<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foldjord // D&D Campaign Archive</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body, html {
            width: 100%; 
            min-height: 100vh;
            background-color: #0a0b0d;
            
            background-image: 
                linear-gradient(rgba(10, 11, 13, 0.65), rgba(10, 11, 13, 0.85)),
                url('Foldjord.jpg');
            
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: #b5a895;
            font-family: 'Courier Prime', monospace;
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* NAVIGATION / BACK LINK */
        .nav-header {
            width: 100%;
            max-width: 800px;
            padding: 25px 20px 0 20px;
            display: flex;
            justify-content: flex-start;
        }

        .back-link {
            font-size: 13px;
            color: #e5d3b3;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            transition: color 0.4s ease, transform 0.4s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            background: rgba(10, 11, 13, 0.85);
            padding: 8px 14px;
            border-radius: 2px;
            border: 1px solid rgba(200, 150, 62, 0.4);
        }

        .back-link:hover {
            color: #c8963e;
            transform: translateX(-4px);
        }

        /* HEADER AREA */
        .main-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-top: 2vh;
            margin-bottom: 6vh;
        }

        .realm-title {
            text-align: center;
            position: relative;
            background: rgba(10, 11, 13, 0.85);
            padding: 20px 40px;
            border-radius: 4px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(200, 150, 62, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .realm-title::after {
            content: '';
            display: block;
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c8963e, transparent);
            margin: 20px auto 0 auto;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(42px, 10vw, 86px);
            font-weight: 900;
            letter-spacing: 12px; 
            color: #e5d3b3;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(200, 150, 62, 0.3);
            margin: 0;
            user-select: none;
        }

        .subtitle {
            font-size: 13px;
            letter-spacing: 6px;
            color: #a82e2e;
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* CONTENT PLACEHOLDER CARD */
        .archive-card {
            width: 100%;
            background: rgba(12, 14, 18, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 2px solid #c8963e;
            border-bottom: 1px solid #232730;
            border-left: 1px solid rgba(200, 150, 62, 0.2);
            border-right: 1px solid rgba(200, 150, 62, 0.2);
            border-radius: 2px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        /* SEVERSKÝ SYMBOL (VEGVÍSIR) */
        .norse-symbol {
            width: 64px;
            height: 64px;
            fill: none;
            stroke: #c8963e;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.9;
            filter: drop-shadow(0 0 10px rgba(200, 150, 62, 0.5));
            animation: floatAndRotate 12s ease-in-out infinite;
        }

        @keyframes floatAndRotate {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(6deg); }
        }

        .status-msg {
            font-size: 15px;
            letter-spacing: 3px;
            color: #e5d3b3;
            text-transform: uppercase;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            color: #8c8172;
            max-width: 500px;
        }

        /* FOOTER */
        .footer-sig {
            font-size: 11px;
            letter-spacing: 3px;
            color: #e5d3b3;
            text-transform: uppercase;
            margin-bottom: 4vh;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            background: rgba(10, 11, 13, 0.85);
            padding: 6px 14px;
            border-radius: 2px;
            border: 1px solid rgba(200, 150, 62, 0.3);
        }

        .highlight {
            color: #a82e2e;
        }
    </style>
</head>
<body>

    <header class="nav-header">
        <a href="index.html" class="back-link">
            &larr; [ RETURN_TO_TERMINAL ]
        </a>
    </header>

    <main class="main-container">
        <section class="realm-title">
            <h1>FOLDJORD</h1>
            <div class="subtitle">CAMPAIGN // CHRONICLES</div>
        </section>

        <section class="archive-card">
            <!-- VEGVÍSIR SVG SYMBOL -->
            <svg class="norse-symbol" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="46" stroke-dasharray="2 4"/>
                <circle cx="50" cy="50" r="40" stroke-width="1"/>
                <!-- Hlavní osy -->
                <line x1="50" y1="10" x2="50" y2="90"/>
                <line x1="10" y1="50" x2="90" y2="50"/>
                <line x1="22" y1="22" x2="78" y2="78"/>
                <line x1="22" y1="78" x2="78" y2="22"/>
                <!-- Runové větvení - Sever -->
                <path d="M44 18 h12 M46 24 h8 M50 10 l-4 -4 M50 10 l4 -4"/>
                <!-- Runové větvení - Jih -->
                <circle cx="50" cy="85" r="3" fill="#c8963e"/>
                <path d="M44 76 h12 M46 70 h8"/>
                <!-- Runové větvení - Východ a Západ -->
                <path d="M82 44 v12 M76 46 v8 M18 44 v12 M24 46 v8"/>
                <path d="M90 50 l4 -4 M90 50 l4 4 M10 50 l-4 -4 M10 50 l-4 4"/>
                <!-- Diagonální zak zakončení -->
                <path d="M26 26 l-4 -4 M74 74 l4 4 M26 74 l-4 4 M74 26 l4 -4"/>
                <!-- Středový kruh -->
                <circle cx="50" cy="50" r="6" fill="#121412"/>
            </svg>

            <div class="status-msg">[ ARCHIVE_SEALED ]</div>
            <p class="description">
                Kroniky, mapy a záznamy z temného světa Foldjord jsou momentálně uzamčeny. Brzy zde přibudou přehledy sezení, lore a profily postav.
            </p>
        </section>
    </main>

    <footer class="footer-sig">
        DM_LOGS // <span class="highlight">PELLARHODON</span>
    </footer>

</body>
</html>
