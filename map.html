<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foldjord // Interactive Map & Fog of War</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background-color: #0a0b0d;
            color: #b5a895;
            font-family: 'Courier Prime', monospace;
            overflow: hidden;
            position: relative;
        }

        /* TLAČÍTKO ZPĚT */
        .back-btn {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 100;
            background: rgba(10, 11, 13, 0.9);
            color: #e5d3b3;
            border: 1px solid rgba(200, 150, 62, 0.4);
            padding: 10px 16px;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            transition: color 0.3s, border-color 0.3s;
        }
        .back-btn:hover { color: #c8963e; border-color: #c8963e; }

        /* KONTROLY FOG OF WAR A ZOOMU */
        .control-panel {
            position: fixed;
            bottom: 20px; left: 20px;
            z-index: 100;
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .ctrl-btn {
            background: rgba(10, 11, 13, 0.9);
            color: #c8963e;
            border: 1px solid rgba(200, 150, 62, 0.4);
            padding: 8px 12px;
            font-size: 12px; cursor: pointer;
            backdrop-filter: blur(4px);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .ctrl-btn:hover {
            background: rgba(200, 150, 62, 0.2);
            color: #e5d3b3;
        }
        .ctrl-btn.active {
            background: #a82e2e;
            color: #fff;
            border-color: #ff0000;
        }

        /* MAPOVÝ KONTEJNER */
        .map-wrapper {
            width: 100vw; height: 100vh;
            cursor: grab;
        }
        .map-wrapper.drawing-mode {
            cursor: crosshair !important;
        }

        .map-container {
            position: relative;
            display: inline-block;
        }

        .map-img {
            display: block;
            max-width: none;
            height: 100vh;
            user-select: none;
        }

        /* FOG OF WAR CANVAS OVERLAY */
        #fog-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }
        .drawing-mode #fog-canvas {
            pointer-events: auto;
        }

        /* ZNAČKY NA MAPĚ (PINS) */
        .pin {
            position: absolute;
            width: 20px; height: 20px;
            background: #a82e2e;
            border: 2px solid #c8963e;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(200, 150, 62, 0.9);
            transition: transform 0.2s ease, background 0.2s ease;
            z-index: 10;
        }
        .pin:hover { 
            transform: translate(-50%, -50%) scale(1.4); 
            background: #c8963e;
        }

        /* POSTRANNÍ INFORMAČNÍ PANEL */
        .info-panel {
            position: fixed;
            top: 0; right: -360px;
            width: 340px; height: 100vh;
            background: rgba(12, 14, 18, 0.95);
            border-left: 2px solid #c8963e;
            padding: 40px 25px;
            z-index: 200;
            transition: right 0.4s ease;
            box-shadow: -10px 0 30px rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
        }
        .info-panel.active { right: 0; }

        .close-panel {
            position: absolute; top: 15px; right: 20px;
            background: none; border: none; color: #8c8172;
            font-size: 24px; cursor: pointer;
        }
        .close-panel:hover { color: #c8963e; }

        .info-title {
            font-family: 'Cinzel', serif;
            color: #e5d3b3; font-size: 24px; 
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(200, 150, 62, 0.3);
            padding-bottom: 10px;
        }
        .info-desc { font-size: 14px; line-height: 1.6; color: #b5a895; }
    </style>
</head>
<body>

    <a href="dnd.html" class="back-btn">&larr; [ ARCHIV ]</a>

    <!-- OVLÁDACÍ PANELY -->
    <div class="control-panel">
        <button class="ctrl-btn" id="mode-toggle">🌫️ [ MLHA: VYPNUTA ]</button>
        <button class="ctrl-btn" id="reset-fog">🔄 ZAHALIT VŠE</button>
        <button class="ctrl-btn" id="clear-fog">👁️ ODKRÍT VŠE</button>
        <button class="ctrl-btn" id="zoom-in">+</button>
        <button class="ctrl-btn" id="zoom-out">-</button>
        <button class="ctrl-btn" id="zoom-reset">&#8634;</button>
    </div>

    <!-- OBLAST PRO MAPU, MLHU A ZNAČKY -->
    <div class="map-wrapper" id="map-wrapper">
        <div id="panzoom-elem" class="map-container">
            <img src="Foldjord.jpg" alt="Mapa Foldjord" class="map-img" id="map-img">

            <!-- CANVAS PRO MLHU (FOG OF WAR) -->
            <canvas id="fog-canvas"></canvas>

            <!-- ZNAČKY (PINY) -->
            <div class="pin" style="top: 24.3%; left: 32.1%;" 
                 onclick="openInfo('Kálf', 'Zamrzlé severní souostroví plné ledových obrů.')"></div>
            <div class="pin" style="top: 48.5%; left: 45.2%;" 
                 onclick="openInfo('Dynja', 'Centrální přístavní město a srdce obchodu.')"></div>
            <div class="pin" style="top: 71.2%; left: 78.4%;" 
                 onclick="openInfo('Lengro', 'Divoký jižní kontinent staré magie.')"></div>
        </div>
    </div>

    <!-- INFORMAČNÍ PANEL -->
    <div class="info-panel" id="info-panel">
        <button class="close-panel" onclick="closeInfo()">&times;</button>
        <h2 class="info-title" id="panel-title">Lokace</h2>
        <p class="info-desc" id="panel-desc">Vyberte bod na mapě.</p>
    </div>

    <script>
        // 1. PAN & ZOOM INICIALIZACE
        const wrapper = document.getElementById('map-wrapper');
        const elem = document.getElementById('panzoom-elem');
        const panzoom = Panzoom(elem, {
            maxScale: 5,
            minScale: 1,
            contain: 'outside'
        });

        wrapper.addEventListener('wheel', panzoom.zoomWithWheel);

        document.getElementById('zoom-in').addEventListener('click', panzoom.zoomIn);
        document.getElementById('zoom-out').addEventListener('click', panzoom.zoomOut);
        document.getElementById('zoom-reset').addEventListener('click', panzoom.reset);

        // 2. FOG OF WAR ENGINE
        const img = document.getElementById('map-img');
        const canvas = document.getElementById('fog-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawingMode = false;
        let isDrawing = false;

        function initFog() {
            canvas.width = img.naturalWidth || img.clientWidth;
            canvas.height = img.naturalHeight || img.clientHeight;
            resetFog();
        }

        function resetFog() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(10, 11, 13, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function clearFog() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        if (img.complete) { initFog(); } else { img.onload = initFog; }

        // PŘEPÍNÁNÍ REŽIMU ODKRÝVÁNÍ / POSUNU MAPY
        const modeBtn = document.getElementById('mode-toggle');
        modeBtn.addEventListener('click', () => {
            isDrawingMode = !isDrawingMode;
            if (isDrawingMode) {
                panzoom.disable();
                wrapper.classList.add('drawing-mode');
                modeBtn.classList.add('active');
                modeBtn.textContent = '✏️ [ ODKRÝVÁNÍ MLHY ]';
            } else {
                panzoom.enable();
                wrapper.classList.remove('drawing-mode');
                modeBtn.classList.remove('active');
                modeBtn.textContent = '🌫️ [ MLHA: VYPNUTA ]';
            }
        });

        document.getElementById('reset-fog').addEventListener('click', resetFog);
        document.getElementById('clear-fog').addEventListener('click', clearFog);

        // KRESLENÍ / MAZÁNÍ MLHY
        function reveal(e) {
            if (!isDrawing || !isDrawingMode) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 60, 0, Math.PI * 2, false);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; reveal(e); });
        canvas.addEventListener('mousemove', reveal);
        window.addEventListener('mouseup', () => { isDrawing = false; });

        // 3. POSTRANNÍ PANEL
        function openInfo(title, desc) {
            if (isDrawingMode) return; // V režimu odkrývání neumísťovat panely
            document.getElementById('panel-title').textContent = title;
            document.getElementById('panel-desc').textContent = desc;
            document.getElementById('info-panel').classList.add('active');
        }

        function closeInfo() {
            document.getElementById('info-panel').classList.remove('active');
        }
    </script>
</body>
</html>
