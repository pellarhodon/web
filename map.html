<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foldjord // Interactive Map</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Knihovna pro přibližování a posun -->
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Courier+Prime&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background-color: #0a0b0d;
            color: #b5a895;
            font-family: 'Courier Prime', monospace;
            overflow: hidden;
        }

        /* TLAČÍTKO ZPĚT */
        .back-btn {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 100;
            background: rgba(10, 11, 13, 0.9);
            color: #e5d3b3;
            border: 1px solid rgba(200, 150, 62, 0.4);
            padding: 10px 16px;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .back-btn:hover { color: #c8963e; }

        /* KONTROLY ZOOMU */
        .zoom-controls {
            position: fixed;
            bottom: 20px; left: 20px;
            z-index: 100;
            display: flex; gap: 8px;
        }
        .zoom-btn {
            background: rgba(10, 11, 13, 0.9);
            color: #c8963e;
            border: 1px solid rgba(200, 150, 62, 0.4);
            width: 36px; height: 36px;
            font-size: 18px; cursor: pointer;
        }

        /* MAPOVÝ KONTEJNER */
        .map-wrapper {
            width: 100vw; height: 100vh;
            cursor: grab;
        }
        .map-wrapper:active { cursor: grabbing; }

        .map-container {
            position: relative;
            display: inline-block;
        }

        .map-img {
            display: block;
            max-width: none;
            height: 100vh; /* Přizpůsobí výšku obrazovce */
        }

        /* ZNAČKY NA MAPĚ (PINS) */
        .pin {
            position: absolute;
            width: 24px; height: 24px;
            background: #a82e2e;
            border: 2px solid #c8963e;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(200, 150, 62, 0.8);
            transition: transform 0.2s;
        }
        .pin:hover { transform: translate(-50%, -50%) scale(1.3); }

        /* POSTRANNÍ INFORMAČNÍ PANEL */
        .info-panel {
            position: fixed;
            top: 0; right: -350px;
            width: 320px; height: 100vh;
            background: rgba(12, 14, 18, 0.95);
            border-left: 2px solid #c8963e;
            padding: 30px 20px;
            z-index: 200;
            transition: right 0.4s ease;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }
        .info-panel.active { right: 0; }

        .close-panel {
            position: absolute; top: 15px; right: 15px;
            background: none; border: none; color: #8c8172;
            font-size: 20px; cursor: pointer;
        }
        .info-title {
            font-family: 'Cinzel', serif;
            color: #e5d3b3; font-size: 22px; margin-bottom: 15px;
        }
        .info-desc { font-size: 13px; line-height: 1.6; color: #8c8172; }
    </style>
</head>
<body>

    <a href="dnd.html" class="back-btn">&larr; [ ZPĚT DO ARCHIVU ]</a>

    <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in">+</button>
        <button class="zoom-btn" id="zoom-out">-</button>
        <button class="zoom-btn" id="zoom-reset">&#8634;</button>
    </div>

    <!-- OBLAST PRO MAPU A ZNAČKY -->
    <div class="map-wrapper">
        <div id="panzoom-elem" class="map-container">
            <img src="Foldjord.jpg" alt="Mapa Foldjord" class="map-img">

            <!-- PŘÍKLADY ZNAČEK (Pozice v procentech X a Y) -->
            <div class="pin" style="top: 35%; left: 45%;" 
                 onclick="openInfo('Kálf', 'Severní zamrzlé úseky, kde přežívají jen ti nejodolnější.')"></div>
                 
            <div class="pin" style="top: 60%; left: 70%;" 
                 onclick="openInfo('Lengro', 'Jižní souostroví známé obchodními trasami a piráty.')"></div>
        </div>
    </div>

    <!-- POSTRANNÍ PANEL S DETAILY -->
    <div class="info-panel" id="info-panel">
        <button class="close-panel" onclick="closeInfo()">&times;</button>
        <h2 class="info-title" id="panel-title">Lokace</h2>
        <p class="info-desc" id="panel-desc">Vyberte bod na mapě.</p>
    </div>

    <script>
        // INICIALIZACE POSUNU A ZOOMU
        const elem = document.getElementById('panzoom-elem');
        const panzoom = Panzoom(elem, {
            maxScale: 4,
            minScale: 1,
            contain: 'outside'
        });

        // Ovládání kolečkem
        elem.parentElement.addEventListener('wheel', panzoom.zoomWithWheel);

        // Ovládání tlačítky
        document.getElementById('zoom-in').addEventListener('click', panzoom.zoomIn);
        document.getElementById('zoom-out').addEventListener('click', panzoom.zoomOut);
        document.getElementById('zoom-reset').addEventListener('click', panzoom.reset);

        // FUNKCE PRO PANEL
        function openInfo(title, desc) {
            document.getElementById('panel-title').textContent = title;
            document.getElementById('panel-desc').textContent = desc;
            document.getElementById('info-panel').classList.add('active');
        }

        function closeInfo() {
            document.getElementById('info-panel').classList.remove('active');
        }
    </script>
</body>
</html>
